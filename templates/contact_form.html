<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datos de contacto</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#eef4ff,#fff3f8);font:15px Arial;color:#172033}.card{max-width:540px;margin:4vh auto;background:white;border-radius:20px;padding:26px;box-shadow:0 12px 35px #17203320}.brand{text-align:center;font-size:42px}.card h1{text-align:center;color:#254ea4}.card>p{text-align:center;color:#68748a}label{display:block;margin:15px 0 5px;font-weight:700}select,input{width:100%;padding:11px;border:1px solid #ccd5e4;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#3157d5;color:white;font-weight:700;font-size:16px}.message{background:#e7f7ed;color:#167044;padding:11px;border-radius:9px}</style></head><body><main class="card"><div class="brand">⚽📨</div><h1>Liga Amigos XI</h1><p>Completa tus datos para recibir comunicaciones de la liga.</p>{% if message %}<div class="message">{{ message }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="division">División</label><select id="division" name="division" required><option value="">Selecciona tu división</option>{% for division, managers in league_managers.items %}<option value="{{ division }}" {% if division == selected_division %}selected{% endif %}>{{ division }}</option>{% endfor %}</select><label for="manager">Usuario o manager</label><select id="manager" name="manager" required><option value="">Selecciona tu usuario</option></select><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required><label for="provincia">Provincia</label><input id="provincia" name="provincia" type="text" autocomplete="address-level2" required><button type="submit">Guardar mis datos</button></form>{{ league_managers|json_script:"managers-data" }}</main><script>const data=JSON.parse(document.getElementById('managers-data').textContent),division=document.getElementById('division'),manager=document.getElementById('manager');function loadManagers(){manager.innerHTML='<option value="">Selecciona tu usuario</option>'+(data[division.value]||[]).map(name=>`<option>${name}</option>`).join('')}division.onchange=loadManagers;loadManagers()</script></body></html>
