<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Votar · {{ partido.titulo }}</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#fff1d8,#efe6ff);font:15px Arial;color:#172033}.card{max-width:650px;margin:3vh auto;background:#fff;border-radius:22px;padding:26px;box-shadow:0 15px 40px #34190622}h1{text-align:center;color:#a13e08}.teams{text-align:center;font-size:24px;font-weight:800}.versus{color:#e16518;margin:0 12px}label{display:block;margin:15px 0 6px;font-weight:700}select,button{width:100%;padding:12px;border:1px solid #d9c9bc;border-radius:10px;font:inherit}button{margin-top:20px;border:0;background:#dc6419;color:#fff;font-weight:800}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.options label{background:#fff3e8;border:1px solid #efc9aa;border-radius:10px;padding:12px;text-align:center}.message{background:#e5f7eb;color:#176b3a;padding:11px;border-radius:9px}</style></head><body><main class="card"><h1>⭐ {{ partido.titulo }}</h1><p class="teams">{{ partido.equipo_local }} <span class="versus">VS</span> {{ partido.equipo_visitante }}</p>{% if message %}<p class="message">{{ message }}</p>{% endif %}{% if partido.cerrado %}<p>La votación está cerrada.</p>{% else %}<form method="post">{% csrf_token %}<label>División</label><select id="division" name="division" required><option value="">Selecciona</option>{% for division, managers in league_managers.items %}<option {% if division == selected_division %}selected{% endif %}>{{ division }}</option>{% endfor %}</select><label>Manager</label><select id="manager" name="manager" required></select><label>¿Con quién te posicionas?</label><div class="options"><label><input type="radio" name="posicionamiento" value="local" required> {{ partido.equipo_local }}</label><label><input type="radio" name="posicionamiento" value="visitante"> {{ partido.equipo_visitante }}</label><label><input type="radio" name="posicionamiento" value="ninguno"> Ninguno</label></div><label>¿Cuántos goles habrá en total?</label><select name="pronostico_goles" required><option value="0">0 goles</option><option value="1">1 gol</option><option value="2">2 goles</option><option value="3+">3 o más goles</option></select><button>Guardar mi voto</button></form>{% endif %}{{ league_managers|json_script:"managers-data" }}</main><script>const data=JSON.parse(document.getElementById('managers-data').textContent),division=document.getElementById('division'),manager=document.getElementById('manager');function load(){manager.innerHTML='<option value="">Selecciona tu manager</option>'+(data[division.value]||[]).map(x=>'<option>'+x+'</option>').join('')}if(division){division.onchange=load;load()}</script></body></html>
