<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas Liga Amigos XI</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:linear-gradient(135deg,#eef4ff,#fff3f8);font:14px Arial;color:#172033}main{max-width:1250px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,#152554,#3976d3);color:white;border-radius:18px;padding:22px 26px}.hero h1{margin:0}.hero a{background:white;color:#18316b;text-decoration:none;padding:9px 12px;border-radius:8px}.filters,.card{background:white;border-radius:15px;padding:16px;margin-top:16px;box-shadow:0 6px 20px #17203312}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:12px;color:#68748a;margin-bottom:5px}select{padding:9px;border:1px solid #ccd5e4;border-radius:8px;min-width:190px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card h2{margin-top:0;color:#254ea4}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e6ebf2;text-align:center}th{color:#3157d5;background:#edf1ff}td:nth-child(2),th:nth-child(2){text-align:left}.first{background:#e7f7ed}.last{background:#fdecec}.empty{color:#68748a}@media(max-width:850px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header class="hero"><div><h1>📊 Estadísticas Liga Amigos XI</h1><p>Clasificaciones de cada jornada</p></div><a href="/">Menú principal</a></header><section class="filters"><div><label>División</label><select id="division">{% for division in divisions %}<option>{{ division }}</option>{% endfor %}</select></div><div><label>Jornada</label><select id="jornada">{% for n in jornadas %}<option value="{{ n }}">Jornada {{ n }}</option>{% endfor %}</select></div><strong id="state"></strong></section><div class="grid"><section class="card"><h2>Puntos APP</h2><div id="app"></div></section><section class="card"><h2>Quinielas y porras</h2><div id="bonus"></div></section><section class="card"><h2>Cláusulas</h2><div id="clauses"></div></section><section class="card"><h2>Clasificación total</h2><div id="total"></div></section></div></main><script>
const division=document.getElementById('division'),jornada=document.getElementById('jornada');function table(rows,columns){if(!rows.length)return '<p class="empty">No hay datos guardados para esta jornada.</p>';return '<table><thead><tr><th>Pos.</th><th>Manager</th>'+columns.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr class="'+(i===0?'first':i===rows.length-1?'last':'')+'"><td>'+(i+1)+'</td><td>'+r.manager+'</td>'+columns.map(c=>'<td>'+r[c[1]]+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){let r=await fetch('/api/estadisticas/2026/'+jornada.value+'/?division='+encodeURIComponent(division.value)),d=await r.json(),rows=d.rows||[];document.getElementById('state').textContent=d.closed?'Jornada cerrada':rows.length?'Pendiente de cerrar':'Sin jugar';document.getElementById('app').innerHTML=table([...rows].sort((a,b)=>b.app-a.app),[['Puntos','app']]);document.getElementById('bonus').innerHTML=table([...rows].sort((a,b)=>b.bonus-a.bonus),[['Aciertos quiniela','quinielas'],['Aciertos porra','porras'],['Puntos','bonus']]);document.getElementById('clauses').innerHTML=table([...rows].sort((a,b)=>a.penalty-b.penalty),[['Dinero','money'],['Puntos','penalty']]);document.getElementById('total').innerHTML=table([...rows].sort((a,b)=>b.total-a.total),[['Total neto','total']])}division.onchange=load;jornada.onchange=load;load();
</script></body></html>
