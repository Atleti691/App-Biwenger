<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas Liga Amigos XI</title>
<style>*{box-sizing:border-box}body{margin:0;padding:22px;background:linear-gradient(135deg,#eef4ff,#fff3f8);font:14px Arial;color:#172033}main{max-width:1250px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,#152554,#3976d3);color:white;border-radius:18px;padding:22px 26px}.hero h1{margin:0}.hero a{background:white;color:#18316b;text-decoration:none;padding:9px 12px;border-radius:8px}.filters,.card{background:white;border-radius:15px;padding:16px;margin-top:16px;box-shadow:0 6px 20px #17203312}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:12px;color:#68748a;margin-bottom:5px}select{padding:9px;border:1px solid #ccd5e4;border-radius:8px;min-width:185px}.content{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:16px}.card h2{margin-top:0;color:#254ea4}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e6ebf2;text-align:center}th{color:#3157d5;background:#edf1ff}td:nth-child(2),th:nth-child(2){text-align:left}.first{background:#fff7cc}.last{background:#fdecec}.podium,.danger-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.podium{align-items:end;margin:32px 0 18px}.place,.danger-place{border-radius:12px;padding:12px 6px;overflow-wrap:anywhere}.gold{min-height:140px;background:#fff2a8;transform:translateY(-16px);box-shadow:0 8px 18px #d4a90033}.silver{min-height:112px;background:#e8edf4}.bronze{min-height:98px;background:#f4d5bc}.medal,.danger-icon{font-size:30px}.danger-title{display:block;color:#a52a2a;text-align:center;margin:18px 0 8px}.danger-podium{align-items:start;padding-bottom:28px}.danger-place{background:#ffe8dd;border:2px solid #f2b89f}.danger-place.worst{transform:translateY(22px);background:#ffd5d5;border-color:#dc7777}.empty{color:#68748a}@media(max-width:850px){.content{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}</style></head>
<body><main><header class="hero"><div><h1>📊 Estadísticas Liga Amigos XI</h1><p>Clasificaciones generales y por jornada</p></div><a href="/">Menú principal</a></header><section class="filters"><div><label>División</label><select id="division">{% for division in divisions %}<option>{{ division }}</option>{% endfor %}</select></div><div><label>Periodo</label><select id="mode"><option value="general">Clasificación general</option><option value="round">Por jornada</option></select></div><div id="round-box" style="display:none"><label>Jornada</label><select id="jornada">{% for n in jornadas %}<option value="{{ n }}">Jornada {{ n }}</option>{% endfor %}</select></div><div><label>Clasificación</label><select id="ranking"><option value="total">Clasificación total</option><option value="app">Puntos APP</option><option value="bonus">Quinielas y porras</option><option value="clauses">Cláusulas</option></select></div><strong id="state"></strong></section><div class="content"><section class="card"><h2 id="title">Clasificación total</h2><div id="table"></div></section><aside class="card"><h2>Destacados</h2><div id="podium"></div><div id="bottom"></div></aside></div></main>
<script>const division=document.getElementById('division'),mode=document.getElementById('mode'),jornada=document.getElementById('jornada'),ranking=document.getElementById('ranking'),titles={total:'Clasificación total',app:'Puntos APP',bonus:'Quinielas y porras',clauses:'Cláusulas'};function value(r){return ranking.value==='clauses'?r.penalty:r[ranking.value]}function columns(){return ranking.value==='bonus'?[['Aciertos quiniela','quinielas'],['Aciertos porra','porras'],['Puntos','bonus']]:ranking.value==='clauses'?[['Dinero','money'],['Penalización','penalty']]:ranking.value==='app'?[['Puntos APP','app']]:[['Total neto','total']]}function card(r,kind,icon){return '<div class="place '+kind+'"><div class="medal">'+icon+'</div><strong>'+r.manager+'</strong><p>'+value(r)+'</p></div>'}function render(rows){let sorted=[...rows].sort((a,b)=>ranking.value==='clauses'?a.penalty-b.penalty:value(b)-value(a)),cols=columns();document.getElementById('title').textContent=titles[ranking.value];document.getElementById('table').innerHTML=sorted.length?'<table><thead><tr><th>Pos.</th><th>Manager</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+sorted.map((r,i)=>'<tr class="'+(i===0?'first':i===sorted.length-1?'last':'')+'"><td>'+(i+1)+'</td><td>'+r.manager+'</td>'+cols.map(c=>'<td>'+r[c[1]]+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="empty">No hay datos guardados.</p>';let top=sorted.slice(0,3);document.getElementById('podium').innerHTML=top.length?'<div class="podium">'+(top[1]?card(top[1],'silver','🥈'):'<div></div>')+card(top[0],'gold','🥇')+(top[2]?card(top[2],'bronze','🥉'):'<div></div>')+'</div>':'';let last=sorted.slice(-3),worst=last[last.length-1],before=last[last.length-2],third=last[last.length-3];document.getElementById('bottom').innerHTML=worst?'<strong class="danger-title">Zona de peligro</strong><div class="danger-podium">'+(third?'<div class="danger-place"><div class="danger-icon">😰</div><strong>'+third.manager+'</strong><p>'+value(third)+'</p></div>':'<div></div>')+'<div class="danger-place worst"><div class="danger-icon">💀</div><strong>'+worst.manager+'</strong><p>'+value(worst)+'</p></div>'+(before?'<div class="danger-place"><div class="danger-icon">🎃</div><strong>'+before.manager+'</strong><p>'+value(before)+'</p></div>':'<div></div>')+'</div>':''}async function load(){document.getElementById('round-box').style.display=mode.value==='round'?'block':'none';let r=await fetch('/api/estadisticas/2026/'+jornada.value+'/?division='+encodeURIComponent(division.value)+'&mode='+mode.value),d=await r.json();document.getElementById('state').textContent=mode.value==='general'?(d.journeys||0)+' jornadas contabilizadas':d.closed?'Jornada cerrada':d.rows.length?'Pendiente de cerrar':'Sin jugar';render(d.rows||[])}[division,mode,jornada,ranking].forEach(x=>x.onchange=load);load();</script></body></html>
