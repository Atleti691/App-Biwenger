<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balón Guía</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;font:15px Arial;background:linear-gradient(135deg,#e8f4ff,#fff0f5);color:#172033}main{max-width:850px;margin:auto}.hero,.chat{background:white;border-radius:20px;padding:24px;box-shadow:0 9px 28px #17203318}.hero{text-align:center;background:linear-gradient(135deg,#152554,#3976d3);color:white}.hero a{float:right;color:#17336f;background:white;padding:8px 11px;border-radius:8px;text-decoration:none}.ball{width:120px;height:120px;margin:5px auto 15px;border-radius:50%;background:white;border:5px solid #182d60;position:relative;animation:bounce 2s infinite}.ball:before{content:'⚽';font-size:89px;position:absolute;left:10px;top:7px}.eyes{position:absolute;z-index:2;top:35px;left:35px;font-size:24px;letter-spacing:24px}.smile{position:absolute;z-index:2;top:66px;left:48px;font-size:27px}@keyframes bounce{50%{transform:translateY(-8px) rotate(4deg)}}.chat{margin-top:18px}.question{display:flex;gap:9px}input{flex:1;padding:13px;border:2px solid #cdd8ed;border-radius:10px}button,.answer a{border:0;padding:12px 15px;border-radius:9px;background:#3157d5;color:white;cursor:pointer;text-decoration:none;display:inline-block}.answer{margin-top:18px;padding:16px;background:#f1f6ff;border-radius:12px;min-height:70px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.quick button{background:#eef3ff;color:#3157d5}.tip{color:#687386}@media(max-width:600px){body{padding:12px}.question{display:block}.question input,.question button{width:100%;margin-bottom:8px}}</style></head><body><main><header class="hero"><a href="/">Menú</a><div class="ball"><span class="eyes">••</span><span class="smile">⌣</span></div><h1>Balón Guía</h1><p>¡Hola! Dime qué quieres hacer y te enseñaré el camino.</p></header><section class="chat"><div class="question"><input id="question" placeholder="Ejemplo: ¿Dónde voto en un Partido VIP?"><button onclick="answerQuestion()">Preguntar</button></div><div class="quick"><button onclick="ask('estadísticas')">Estadísticas</button><button onclick="ask('partido vip')">Partido VIP</button><button onclick="ask('cláusulas')">Cláusulas</button><button onclick="ask('contraseña')">Contraseña</button><button onclick="ask('torneos')">Torneos</button><button onclick="ask('sugerencia')">Sugerencias</button></div><div id="answer" class="answer"><strong>⚽ Estoy preparado.</strong><p class="tip">Puedes escribir una pregunta o tocar uno de los botones.</p></div></section></main><script>const routes=[{keys:['estadística','estadisticas','clasificación','clasificacion','puntos'],text:'Las clasificaciones generales y por jornada están en Mostrar estadísticas.',url:'/estadisticas/',label:'Ver estadísticas'},{keys:['vip','votar','votación','votacion'],text:'Los partidos, votaciones y resultados especiales están en Partidos VIP.',url:'/partidos-vip/',label:'Ir a Partidos VIP'},{keys:['cláusula','clausula','porra','quiniela','introducir','jornada'],text:'Los administradores y colaboradores introducen estos datos en Introducir datos.',url:'/datos/',label:'Introducir datos'},{keys:['contraseña','contrasena','clave'],text:'Puedes cambiar tu clave desde la pantalla de cambio de contraseña.',url:'/cambiar-contrasena/',label:'Cambiar contraseña'},{keys:['torneo','champions','copa'],text:'Los clasificados y competiciones están en Torneos.',url:'/torneos/',label:'Ver torneos'},{keys:['mapa','provincia','procedencia'],text:'El mapa de participantes está en Procedencia.',url:'/procedencia/',label:'Ver procedencia'},{keys:['sugerencia','idea','mejora'],text:'Puedes proponer y apoyar mejoras desde el Buzón de sugerencias.',url:'/sugerencias/',label:'Enviar sugerencia'}];function ask(text){document.getElementById('question').value=text;answerQuestion()}function answerQuestion(){const value=document.getElementById('question').value.toLowerCase().trim(),found=routes.find(item=>item.keys.some(key=>value.includes(key)));document.getElementById('answer').innerHTML=found?`<strong>⚽ ${found.text}</strong><p><a href="${found.url}">${found.label} →</a></p>`:'<strong>⚽ Todavía no conozco esa respuesta.</strong><p>Prueba con estadísticas, Partido VIP, cláusulas, contraseña, torneos, mapa o sugerencias. También puedes dejar la pregunta como sugerencia.</p><a href="/sugerencias/">Ir a sugerencias →</a>'}document.getElementById('question').addEventListener('keydown',e=>{if(e.key==='Enter')answerQuestion()});</script></body></html>
