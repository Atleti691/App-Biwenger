<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar colaboradores</title><style>body{font-family:Arial;background:#f4f6fa;padding:28px;color:#172033}main{max-width:600px;margin:auto;background:white;padding:24px;border-radius:12px}label{display:block;margin:14px 0 5px;font-weight:bold}input{width:100%;padding:10px;box-sizing:border-box}button{margin-top:20px;padding:11px 16px;background:#3157d5;color:white;border:0;border-radius:7px}.ok{color:#16804d}</style></head><body><main><h1>Configurar colaboradores</h1><p>Solo el administrador puede ver esta pantalla. Escribe la contraseña inicial de cada cuenta.</p>{% if message %}<p class="ok">{{ message }}</p>{% endif %}<form method="post">{% csrf_token %}{% for name in names %}<label for="password_{{ name }}">{{ name }}</label><input id="password_{{ name }}" name="password_{{ name }}" type="password" autocomplete="new-password">{% endfor %}<button type="submit">Guardar cuentas</button></form><p><a href="/">Volver al menú</a></p></main></body></html>
