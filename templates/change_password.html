<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#152554,#3976d3 52%,#55c5c1);font-family:Arial,sans-serif;color:#172033}.card{width:min(430px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 18px 55px #07133166}.logo{text-align:center;font-size:42px}.title{text-align:center;color:#18316b;margin-bottom:8px}.subtitle{text-align:center;color:#637083;margin-bottom:24px}label{display:block;font-weight:600;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd6e6;border-radius:9px;font-size:16px}button,a{display:block;width:100%;text-align:center;border:0;border-radius:9px;padding:13px;margin-top:18px;background:#3157d5;color:#fff;font-size:16px;font-weight:700;text-decoration:none}.back{background:#687386;font-weight:400}.errorlist{color:#b42318;padding-left:18px}</style></head><body><main class="card"><div class="logo">🔐</div><h1 class="title">Cambia tu contraseña</h1><p class="subtitle">Establece una contraseña nueva para continuar.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Guardar nueva contraseña</button></form><a class="back" href="/">Volver al menú principal</a></main></body></html>
